<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Panda — hero</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* ==========================================================================
     HERO
     No dark frame. The reference's black surround was Behance presentation chrome,
     not the design. The hero is full-bleed and occupies exactly one viewport:
     nav + hero = 100svh. Landing page is the hero alone, so it does not scroll.
     ========================================================================== */

      html {
        scroll-behavior: smooth;
      }
      :root {
        --nav-h: 86px;
      } /* keep in sync: .nav height is derived from it */
      @media (max-width: 560px) {
        :root {
          --nav-h: 68px;
        }
      }
      body {
        background: var(--bg);
        overflow-x: clip;
      }

      .wrap {
        max-width: var(--shell);
        margin: 0 auto;
        padding: 0 var(--s5);
      }
      @media (max-width: 560px) {
        .wrap {
          padding: 0 var(--s3);
        }
      }

      /* ---------------------------------------------------------------- nav --- */
      .nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: var(--s4);
        padding: 0;
        height: var(--nav-h);
        position: relative;
        z-index: 4;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: -0.025em;
        font-size: 18px;
        justify-self: start;
      }
      .brand i {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--ink);
        display: block;
        position: relative;
      }
      .brand i::after {
        content: "";
        position: absolute;
        inset: 8px 7px;
        border-radius: 2px;
        background: var(--bg);
      }

      .navlinks {
        display: flex;
        gap: var(--s5);
        justify-self: center;
        font-size: 14px;
      }
      .navlinks a {
        color: var(--ink);
        text-decoration: none;
        white-space: nowrap;
        transition: opacity 0.15s;
      }
      .navlinks a::before {
        content: "\2022";
        color: var(--ink-4);
        margin-right: 10px;
      }
      .navlinks a:hover {
        opacity: 0.6;
      }

      .cta {
        justify-self: end;
        padding: 11px 22px;
        border-radius: var(--r-pill);
        background: var(--bg-sunk);
        font-size: 14px;
        color: var(--ink);
        border: 1px solid transparent;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .cta:hover {
        background: #e9e9ec;
        border-color: var(--line);
      }

      @media (max-width: 900px) {
        .nav {
          grid-template-columns: 1fr auto;
        }
        .navlinks {
          display: none;
        }
      }

      /* --------------------------------------------------------------- hero --- */
      .hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
      }

      .media {
        position: absolute;
        inset: 0;
        z-index: -2;
        background: #ded7c9 url("hero-bahria-town.jpg") center 26% / cover
          no-repeat;
        filter: saturate(1.04) contrast(1.02);
      }
      .media::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(255, 246, 232, 0.18) 0%,
          rgba(255, 255, 255, 0) 55%
        );
      }
      /* the scrim exists only to carry headline legibility */
      .scrim {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.92) 0%,
          rgba(255, 255, 255, 0.62) 24%,
          rgba(255, 255, 255, 0.08) 48%,
          rgba(255, 255, 255, 0) 64%,
          rgba(18, 16, 12, 0.14) 100%
        );
      }

      .hero__inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        min-height: calc(100svh - var(--nav-h));
        padding: var(--s5) 0 var(--s6);
      }
      @media (max-width: 560px) {
        .hero__inner {
          padding: var(--s4) 0 var(--s5);
        }
      }

      .hero__head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 268px;
        gap: var(--s6);
        align-items: start;
      }
      .hero__title {
        font-size: clamp(38px, 5.4vw, 64px);
        font-weight: 700;
        letter-spacing: -0.042em;
        line-height: 1.03;
        margin: 0;
        max-width: 16ch;
        text-wrap: balance; /* stops "prove." orphaning onto its own line */
      }
      .hero__lede {
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--ink-2);
        margin: 8px 0 0;
        padding-top: 2px;
        border-left: 2px solid rgba(17, 17, 17, 0.1);
        padding-left: 14px;
      }
      @media (max-width: 820px) {
        .hero__head {
          grid-template-columns: 1fr;
          gap: var(--s3);
        }
        .hero__lede {
          max-width: 46ch;
          margin-top: var(--s2);
        }
      }

      /* ------------------------------------------------------------- search --- */
      .searchwrap {
        margin-top: auto;
        padding-top: clamp(36px, 7vh, 80px);
      }

      .search {
        position: relative;
        max-width: 1020px;
      }

      .tabs {
        position: absolute;
        left: 14px;
        top: -41px;
        z-index: 3;
        display: inline-flex;
        gap: 4px;
        padding: 5px;
        background: var(--bg);
        border-radius: var(--r-pill);
        box-shadow:
          0 8px 24px rgba(16, 24, 40, 0.1),
          0 0 0 1px rgba(16, 24, 40, 0.04);
        max-width: calc(100% - 28px);
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: 0 0 auto;
        appearance: none;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 11px 24px;
        border-radius: var(--r-pill);
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-2);
        white-space: nowrap;
        transition:
          background 0.18s,
          color 0.18s;
      }
      .tab:hover {
        color: var(--ink);
        background: rgba(0, 0, 0, 0.035);
      }
      .tab.on {
        background: var(--bg-sunk);
        color: var(--ink);
        font-weight: 600;
      }
      .tab .n {
        font-variant-numeric: tabular-nums;
        color: var(--ink-3);
        margin-left: 7px;
        font-size: 13px;
      }
      .tab.on .n {
        color: var(--ink-2);
      }

      .bar {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: var(--s2);
        height: 76px;
        padding: 0 10px 0 26px;
        background: var(--bg);
        border-radius: var(--r-pill);
        box-shadow:
          0 12px 40px rgba(16, 24, 40, 0.13),
          0 0 0 1px rgba(16, 24, 40, 0.05);
        transition: box-shadow 0.2s;
      }
      .bar:focus-within {
        box-shadow:
          0 16px 50px rgba(16, 24, 40, 0.18),
          0 0 0 1px rgba(16, 24, 40, 0.09);
      }
      .bar .plus {
        color: var(--ink);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        margin-right: 6px;
      }
      .bar input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 16.5px;
        letter-spacing: -0.01em;
      }
      .bar input::placeholder {
        color: var(--ink-3);
      }
      .bar .ghost {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .bar .ghost:hover {
        background: var(--bg-sunk);
        color: var(--ink);
      }
      /* light circle with a border — matches the reference */
      .bar .go {
        width: 50px;
        height: 50px;
        flex: 0 0 50px;
        border-radius: 50%;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.18s,
          color 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .bar .go:hover:not(:disabled) {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .bar .go:active:not(:disabled) {
        transform: scale(0.94);
      }
      .bar .go:disabled {
        color: var(--ink-4);
        cursor: default;
      }

      /* -------------------------------------------------------------- chips --- */
      .chips {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: var(--s4);
      }
      .gchip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 19px;
        border-radius: var(--r-pill);
        background: rgba(26, 24, 20, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(10px) saturate(1.2);
        -webkit-backdrop-filter: blur(10px) saturate(1.2);
        color: #fff;
        font-size: 13.5px;
        letter-spacing: -0.005em;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .gchip:hover {
        background: rgba(26, 24, 20, 0.62);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-1px);
      }
      .gchip svg {
        opacity: 0.7;
      }
      @media (max-width: 820px) {
        .chips {
          flex-wrap: nowrap;
          overflow-x: auto;
          scrollbar-width: none;
          padding-bottom: 2px;
        }
        .chips::-webkit-scrollbar {
          display: none;
        }
        .gchip {
          flex: 0 0 auto;
        }
      }

      @media (max-width: 560px) {
        .bar {
          height: 64px;
          padding-left: 20px;
        }
        .bar .ghost {
          display: none;
        }
        .bar .go {
          width: 44px;
          height: 44px;
          flex-basis: 44px;
        }
        .tab {
          padding: 10px 18px;
          font-size: 13px;
        }
        .tabs {
          top: -27px;
          left: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================================ nav ===== -->
    <header>
      <div class="wrap">
        <nav class="nav">
          <a
            class="brand"
            href="#"
            style="color: inherit; text-decoration: none"
            ><i></i> Panda</a
          >
          <div class="navlinks">
            <a href="#">Ask</a><a href="#">Sources</a><a href="#">Coverage</a>
          </div>
          <button class="cta">Contact us</button>
        </nav>
      </div>
    </header>

    <!-- =========================================================== hero ===== -->
    <section class="hero">
      <div class="media" aria-hidden="true"></div>
      <div class="scrim" aria-hidden="true"></div>

      <div class="wrap hero__inner">
        <div class="hero__head">
          <h1 class="hero__title">Ask what you can prove.</h1>
          <p class="hero__lede">
            Every answer is a quote from a dated public source. Where the corpus
            is silent, Panda says so plainly rather than guessing.
          </p>
        </div>

        <div class="searchwrap">
          <div class="search">
            <div class="tabs" role="tablist">
              <button class="tab on" role="tab" aria-selected="true">
                All <span class="n">10</span>
              </button>
              <button class="tab" role="tab" aria-selected="false">
                Rate <span class="n">3</span>
              </button>
              <button class="tab" role="tab" aria-selected="false">
                Balloting <span class="n">2</span>
              </button>
              <button class="tab" role="tab" aria-selected="false">
                Possession <span class="n">0</span>
              </button>
              <button class="tab" role="tab" aria-selected="false">
                Fees <span class="n">0</span>
              </button>
            </div>
            <div class="bar">
              <input
                type="text"
                value="4 marla allocation in DHA Phase 7"
                placeholder="Ask about any area in Lahore"
                aria-label="Search"
              />
              <button class="go" title="Ask" aria-label="Ask">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
              </button>
            </div>
          </div>
          <div class="chips">
            <button class="gchip">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M3 3v18h18" />
                <path d="M7 14l4-4 3 3 5-6" /></svg
              >4 marla allocation in DHA Phase 7
            </button>
            <button class="gchip">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M9 11l3 3L22 4" />
                <path
                  d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"
                /></svg
              >balloting in DHA Phase 10
            </button>
            <button class="gchip">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" /></svg
              >10 marla under 55 lac
            </button>
            <button class="gchip">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path
                  d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
                />
                <path d="M14 2v6h6" /></svg
              >fees in DHA Phase 6
            </button>
          </div>
        </div>
      </div>
    </section>

    <script>
      const tabs = [...document.querySelectorAll(".tab")];
      tabs.forEach((t) =>
        t.addEventListener("click", () => {
          tabs.forEach((x) => {
            x.classList.remove("on");
            x.setAttribute("aria-selected", "false");
          });
          t.classList.add("on");
          t.setAttribute("aria-selected", "true");
        }),
      );
      const input = document.querySelector(".bar input"),
        go = document.querySelector(".go");
      go.disabled = !input.value.trim();
      input.addEventListener("input", () => {
        go.disabled = !input.value.trim();
      });
      document.querySelectorAll(".gchip").forEach((c) =>
        c.addEventListener("click", () => {
          input.value = c.textContent.trim();
          go.disabled = false;
        }),
      );
    </script>
  </body>
</html>
